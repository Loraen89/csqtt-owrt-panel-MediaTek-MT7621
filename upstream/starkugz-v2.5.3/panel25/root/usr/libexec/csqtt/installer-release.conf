#
# [063] Источник обновлений панели CSQTT для LuCI («О программе»).
# Читается установщиком /usr/libexec/csqtt/install-csqtt.sh, который вызывает
# только серверный rpcd-метод: из браузера URL, теги, пути и хэши не
# принимаются.
#
# Публичный репозиторий панели (docs/BRANDING.md). Тег не зашит: панель
# читает точный тег последнего опубликованного (не draft/prerelease) выпуска
# через GitHub API и дальше использует только URL /releases/download/<тег>/.
# Строка latest как тег не принимается. Чтобы привязать панель к точному
# выпуску, задайте CSQTT_RELEASE_TAG (например, v2.5.3) в
# /etc/csqtt-installer-release.conf — он имеет приоритет над этим файлом.
#
# Значения можно переопределить переменными окружения с теми же именами.

CSQTT_RELEASE_OWNER=${CSQTT_RELEASE_OWNER:-starkugz}
CSQTT_RELEASE_REPO=${CSQTT_RELEASE_REPO:-csqtt-openwrt}
CSQTT_RELEASE_TAG=${CSQTT_RELEASE_TAG:-}
